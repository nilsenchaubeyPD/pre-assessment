<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v9 · Wavekit · Topin Pre-assessment Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
/* Wavekit · _Primitives / 3. Spacing (px) */
--spacing-0:0;--spacing-1:4px;--spacing-2:8px;--spacing-3:12px;--spacing-4:16px;--spacing-6:24px;--spacing-8:32px;--spacing-10:40px;--spacing-12:48px;--spacing-16:64px;
/* Wavekit · 2. Radius */
--radius-xxs:2px;--radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:12px;--radius-2xl:16px;--radius-3xl:20px;--radius-4xl:24px;--radius-full:9999px;
/* Wavekit · 6. Typography · font size */
--text-xs:0.75rem;--text-sm:0.875rem;--text-md:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-display-xs:1.5rem;
/* Wavekit · effect styles */
--shadow-xs:0 1px 2px rgba(0,0,0,.05);
--shadow-xs-skeuomorphic:0 1px 2px rgba(0,0,0,.05),inset 0 -2px 0 rgba(0,0,0,.05),inset 0 0 0 1px rgba(0,0,0,.18);
--shadow-sm:0 1px 2px -1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.1);
--shadow-md:0 2px 4px -2px rgba(0,0,0,.06),0 4px 6px -1px rgba(0,0,0,.1);
--shadow-lg:0 2px 2px -1px rgba(0,0,0,.04),0 4px 6px -2px rgba(0,0,0,.03),0 12px 16px -4px rgba(0,0,0,.08);
--shadow-xl:0 3px 3px -1.5px rgba(0,0,0,.04),0 8px 8px -4px rgba(0,0,0,.03),0 20px 24px -4px rgba(0,0,0,.08);
--shadow-2xl:0 4px 4px -2px rgba(0,0,0,.04),0 24px 48px -12px rgba(0,0,0,.18);
--focus-ring:0 0 0 2px #fff,0 0 0 4px #2563EB;
--focus-ring-shadow-xs:0 0 0 2px #fff,0 0 0 4px #2563EB,0 1px 2px rgba(0,0,0,.05);
}
/* v9 tokens (Wavekit Topin-Tech) */
:root{--cta:#0C1638;--cta-hover:#15265F;--brand-100:#E3EAFA;--brand-50:#F4F7FD;--brand-600:#2563EB;--brand-700:#2253BF;--c-0e7490:#1B7994;--c-1e40af:#1B4197;--c-1f355a:#1F355A;--c-22c55e:#66B88C;--c-2f7a52:#3B7F5A;--c-33b5d9:#33B5D9;--c-3a4150:#5D584C;--c-4783ea:#648CE4;--c-5b3fd1:#2253BF;--c-6d28d9:#2253BF;--c-85b9ff:#97B2ED;--c-86efac:#B1D9C4;--c-9aa1ad:#A6A093;--c-b42318:#823F4F;--c-b4232c:#823F4F;--c-bbf7d0:#D1E8DC;--c-bfe3cc:#D1E8DC;--c-c026d3:#B36578;--c-c3dbfa:#C1D1F4;--c-c8323a:#823F4F;--c-ceeef3:#CEEEF3;--c-daf1f7:#E9F7F9;--c-dff3e7:#EAF4EF;--c-ebeff5:#E3EAFA;--c-ededed:#EEECEA;--c-eeeafd:#F4F7FD;--c-eef3fd:#F4F7FD;--c-ef4444:#B36578;--c-f0408c:#B36578;--c-f1c5c1:#E7D1D6;--c-f1faf4:#F7FBF9;--c-f3c6ce:#E7D1D6;--c-f3f5f9:#F5F7FC;--c-f3f6fc:#F4F7FD;--c-f59e0b:#E49A52;--c-f5f3ff:#F4F7FD;--c-f7f9fd:#F4F7FD;--c-fafbfd:#F4F7FD;--c-fca5a5:#D6B1BA;--c-fcd34d:#E1C754;--c-fde68a:#EAD786;--c-fde7ec:#F4EAED;--c-ff5a5f:#B36578;--c-ff7a3d:#E49A52;--c-fff0d2:#FFF5C8;--c-fff6f7:#FBF7F8;--c-fffafa:#FBF7F8;--error-100:#F4EAED;--error-200:#E7D1D6;--error-50:#FBF7F8;--error-600:#9F4E61;--error-700:#823F4F;--gray-100:#EEECEA;--gray-200:#D9D5CD;--gray-300:#C1BDB3;--gray-400:#A6A093;--gray-50:#F9F8F7;--gray-500:#766F60;--gray-600:#5D584C;--gray-700:#454138;--gray-800:#2C2A24;--gray-900:#2C2A24;--success-100:#EAF4EF;--success-50:#F7FBF9;--success-600:#3B7F5A;--success-700:#2B5C42;--warning-50:#FCFAF0;--warning-600:#D97F27;--warning-700:#B46920;--white:#FFFFFF;}

:root{
  --bg:var(--white); --surface:var(--white); --line:var(--gray-200); --line2:var(--gray-300);
  --ink:var(--gray-800); --ink2:var(--gray-700); --muted:var(--gray-600); --faint:var(--gray-400);
  --blue:var(--brand-600); --blue-s:var(--brand-50); --blue-m:var(--brand-100); --blue-b:var(--c-c3dbfa); --blue-t:var(--c-1e40af);
  --green:var(--success-700); --green-s:var(--success-50); --green-b:var(--c-22c55e);
  --amber-s:var(--warning-50); --amber-b:var(--c-f59e0b); --amber-t:var(--warning-700);
  --cyan-s:var(--c-ceeef3); --cyan-b:var(--c-33b5d9);
  --red:var(--error-700); --red-s:var(--error-50); --red-b:var(--c-fca5a5);
  --btn:var(--brand-600); --btn-h:var(--brand-700); --btn-t:var(--white); --dis:var(--gray-200); --dis-t:var(--gray-400);
  --dot:rgba(44,42,36,.13); --scrim:rgba(44,42,36,.45);
  --shadow:none;
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Manrope',system-ui,sans-serif;font-size:var(--text-md);line-height:1.55;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--blue);font-weight:600;text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ph{border-bottom:1.5px dotted var(--faint);white-space:nowrap}

/* header */
.hdr{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-4);padding-inline:max(1.5rem,env(safe-area-inset-left,0px)) max(1.5rem,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:var(--spacing-2);font-family:'Manrope',sans-serif;font-weight:600;font-size:var(--text-xl);letter-spacing:-.03em;color:var(--ink)}
.logo svg{width:24px;height:28px}
.logo i{font-style:normal;background:linear-gradient(90deg,var(--c-f0408c),var(--c-ff7a3d));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:var(--spacing-3)}
.namechip{height:36px;padding:0 var(--spacing-4);border-radius:var(--radius-full);background:var(--line);display:flex;align-items:center;gap:var(--spacing-2);font-weight:600;font-size:var(--text-sm)}
.namechip .av{width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-size:var(--text-xs)}

/* buttons etc */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-2);height:44px;padding:0 var(--spacing-6);border-radius:var(--radius-md);background:var(--btn);color:var(--btn-t);font-weight:600;font-size:var(--text-md);transition:background .15s,transform .1s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:var(--dis);color:var(--dis-t);cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:36px;padding:0 var(--spacing-4);font-size:var(--text-sm)}
.btn.lg{height:54px;font-size:var(--text-md);padding:0 2.25rem}
.btn.full{width:100%}
.btn.busy:disabled{background:var(--btn);color:var(--btn-t);cursor:progress}
.btn.ok:disabled{background:var(--green-b);color:var(--gray-900);cursor:default}
.link{background:none;color:var(--blue);font-weight:600;padding:var(--spacing-2) var(--spacing-1);min-height:40px}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:var(--white);border-radius:50%;animation:sp .8s linear infinite;flex:none}
.btn.busy .spin{border-color:rgba(142,134,117,.35);border-top-color:currentColor}
@keyframes sp{to{transform:rotate(360deg)}}
.ck path{stroke-dasharray:26;stroke-dashoffset:26;animation:dr .45s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fade{animation:fd .3s cubic-bezier(.22,1,.36,1)}
.fade.same{animation:fd2 .18s ease-out}
@keyframes fd{from{opacity:0;transform:translateX(28px)}}
@keyframes fd2{from{opacity:.9}}
.okc{width:32px;height:32px;border-radius:50%;background:var(--success-50);display:flex;align-items:center;justify-content:center;align-self:center;opacity:0;animation:okc 1.5s ease forwards}
.okc .ic{display:block;width:20px;height:20px;color:var(--success-600);stroke:var(--success-600)}
.okc .ck path{animation-duration:.3s;animation-delay:.1s;animation-timing-function:cubic-bezier(.65,0,.35,1)}
@keyframes okc{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.vlist.v2 li.still .vi,.vlist.v2 li.still .ck path{animation:none}.vlist.v2 li.still .ck path{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.fade,.ck path,.spin,.meter i{animation:none!important}.ck path{stroke-dashoffset:0}}

/* stepper */
.steps{background:var(--surface);border-bottom:1px solid var(--line)}
.stepsin{max-width:960px;margin:0 auto;padding:var(--spacing-4) var(--spacing-6);display:flex;align-items:center;gap:var(--spacing-3)}
.st{display:flex;align-items:center;gap:var(--spacing-2);font-size:var(--text-sm);font-weight:600;color:var(--faint);white-space:nowrap}
.st i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:var(--text-xs);color:var(--faint);background:var(--surface)}
.st.cur{color:var(--blue)}.st.cur i{background:var(--btn);border-color:var(--btn);color:var(--btn-t)}
.st.done{color:var(--green)}.st.done i{background:var(--green-b);border-color:var(--green-b);color:var(--gray-900)}
.st.done i .ic,.st i .ic{width:16px;height:16px;stroke-width:1.5}
.st:not(.cur) .lb{display:none}
.sline{flex:1;height:2px;background:var(--line);min-width:8px;border-radius:var(--radius-xxs)}
.sline.done{background:var(--green-b)}

/* banners */
.ban{display:flex;gap:var(--spacing-3);align-items:center;justify-content:center;padding:var(--spacing-3) var(--spacing-6);font-size:var(--text-sm);font-weight:600;border-bottom:1px solid transparent}
.b-warn{background:var(--amber-s);color:var(--amber-t);border-color:var(--amber-b)}
.b-bad{background:var(--red-s);color:var(--red);border-color:var(--red-b)}

/* layout */
main{position:relative}
main::before{display:none;content:"";position:absolute;inset:0 0 auto 0;height:360px;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none}
.col{position:relative;width:100%;max-width:960px;margin:0 auto;padding:2.25rem var(--spacing-6) 8.75rem}
.cwrap{max-width:500px;margin:0 auto}
.cwrap.w{max-width:600px}
.eyebrow{font-size:var(--text-sm);font-weight:600;color:var(--blue);margin-bottom:var(--spacing-2)}
h1.h1{font-size:var(--text-display-xs);line-height:1.15;font-weight:600;margin-bottom:var(--spacing-3);outline:none!important;box-shadow:none!important}
.sub{font-size:var(--text-md);color:var(--muted);margin-bottom:var(--spacing-6);max-width:620px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--spacing-8);box-shadow:none;margin-bottom:var(--spacing-6)}
.card h2{font-size:var(--text-display-xs);font-weight:600;margin-bottom:var(--spacing-4)}
.ccard{padding:1.75rem}

/* who + tiles + rows */
.who{display:flex;align-items:center;gap:var(--spacing-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--spacing-4) var(--spacing-4);margin-bottom:var(--spacing-4);flex-wrap:wrap}
.ava{width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-family:'Manrope';font-weight:600;font-size:var(--text-md);flex:none}
.whot{flex:1;min-width:200px}.whot b{display:block;font-size:var(--text-md)}.whot span{font-size:var(--text-sm);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);margin-bottom:var(--spacing-6);overflow:hidden;box-shadow:var(--shadow)}
.tile{padding:var(--spacing-4) var(--spacing-6);border-right:1px solid var(--line)}.tile:last-child{border-right:0}
.tile small{display:block;font-size:var(--text-xs);color:var(--muted);font-weight:600;margin-bottom:var(--spacing-1)}
.tile b{font-family:'Manrope';font-weight:600;font-size:var(--text-md)}
.row{display:flex;gap:var(--spacing-4);align-items:flex-start;padding:var(--spacing-4) 0}
.row+.row{border-top:1px solid var(--line)}.row:first-of-type{padding-top:0}.row:last-child{padding-bottom:0}
.ric{width:40px;height:40px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;flex:none}
.ric .ic{width:20px;height:20px}
.rt{font-weight:600;font-size:var(--text-md)}.rd{font-size:var(--text-sm);color:var(--muted)}
.rd .good{color:var(--green);font-weight:600}.rd .slow{color:var(--amber-t);font-weight:600}.rd .off{color:var(--red);font-weight:600}
.spd{display:flex;gap:var(--spacing-4);margin-top:var(--spacing-2);font-weight:600;font-size:var(--text-sm)}
.spd span{display:inline-flex;align-items:center;gap:var(--spacing-2)}.spd .ic{color:var(--blue);width:16px;height:16px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-md)}
.tbl th{background:var(--bg);font-size:var(--text-xs);font-weight:600;color:var(--muted);text-align:left;padding:var(--spacing-3) var(--spacing-6);letter-spacing:.03em}
.tbl td{padding:var(--spacing-4) var(--spacing-6);border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{width:210px;font-weight:600}
.chk{display:flex;gap:var(--spacing-3);align-items:flex-start;font-size:var(--text-md);font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin-top:0px}

/* card flows */
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-4) var(--spacing-4);margin-bottom:var(--spacing-2)}
.ex{position:relative;border:1px solid var(--line2);border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:4/3;background:var(--line)}
.ex svg.pic{width:100%;height:100%;display:block}
.exb{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:var(--radius-sm);background:var(--c-b4232c);display:grid;place-items:center;color:var(--white)}
.exb.ok{background:var(--c-2f7a52)}.exb .ic{width:16px;height:16px;stroke-width:1.5}
.exc{font-size:var(--text-sm);font-weight:600;color:var(--muted);text-align:center;margin-top:var(--spacing-2)}
.camb{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--radius-xl);overflow:hidden;background:linear-gradient(160deg,var(--c-1f355a),var(--gray-900) 75%)}
.camb svg{position:absolute;inset:0;width:100%;height:100%}
.camtag{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:var(--spacing-2);height:26px;padding:0 var(--spacing-3);border-radius:var(--radius-full);background:rgba(44,42,36,.6);color:var(--white);font-size:var(--text-xs);font-weight:600}
.rec{width:7px;height:7px;border-radius:50%;background:var(--c-ff5a5f);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.guide{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.5;stroke-dasharray:7 7}
.q{font-weight:600;text-align:center;margin-top:var(--spacing-4);font-size:var(--text-md)}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--spacing-4) var(--spacing-4)}
.quote small,.heard small{display:block;font-size:var(--text-xs);color:var(--muted);font-weight:600;margin-bottom:var(--spacing-1)}
.quote div{font-family:'Manrope';font-size:var(--text-xl);font-weight:600}
.meter{display:flex;align-items:flex-end;justify-content:center;gap:var(--spacing-1);height:56px;margin:var(--spacing-4) 0}
.meter i{width:12px;background:var(--blue-b);border-radius:var(--radius-xs);animation:mt 1.1s ease-in-out infinite}
.meter i:nth-child(2n){animation-delay:.2s}.meter i:nth-child(3n){animation-delay:.45s}.meter i:nth-child(5n){animation-delay:.7s}
@keyframes mt{0%,100%{height:10px}50%{height:52px}}
.heard{margin-top:var(--spacing-4);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--spacing-4) var(--spacing-4)}
.tr{font-size:var(--text-md);font-weight:600}.tr.empty{color:var(--faint);font-style:italic;font-weight:500}
.okline{display:flex;align-items:center;gap:var(--spacing-2);color:var(--green);font-size:var(--text-sm);font-weight:600;margin-top:var(--spacing-2)}
.fix{margin-top:var(--spacing-4);border-radius:var(--radius-xl);padding:var(--spacing-4) var(--spacing-4);font-size:var(--text-sm);border:1px solid}
.fix.bad{background:var(--red-s);border-color:var(--red-b);color:var(--ink)}
.fix.warn{background:var(--amber-s);border-color:var(--amber-b)}
.fix b{color:var(--red)}
.fix.warn b{color:var(--amber-t)}
.tabs{display:inline-flex;background:var(--line);border-radius:var(--radius-lg);padding:var(--spacing-1);gap:var(--spacing-1);margin:var(--spacing-3) 0}
.tabs button{border-radius:var(--radius-md);padding:var(--spacing-2) var(--spacing-3);font-size:var(--text-sm);font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
.fix ol{margin:var(--spacing-1) 0 0 var(--spacing-6)}
.stuck{margin-top:var(--spacing-3);font-size:var(--text-sm);color:var(--muted)}
.fl{display:block;font-size:var(--text-sm);font-weight:600;color:var(--muted)}
.inp{display:block;width:100%;height:48px;margin-top:var(--spacing-2);padding:0 var(--spacing-4);border:1px solid var(--line2);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);font:500 16px 'Manrope',sans-serif}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-m)}
.ferr{color:var(--red);font-size:var(--text-sm);font-weight:600;margin-top:var(--spacing-2)}
.note-t{background:var(--blue-s);border:1px solid var(--blue-m);color:var(--blue);border-radius:var(--radius-md);padding:var(--spacing-3) var(--spacing-4);font-size:var(--text-sm);font-weight:600;margin:var(--spacing-6) 0 var(--spacing-4)}
.sec-h{font-size:var(--text-md);font-weight:600;color:var(--muted);margin:var(--spacing-6) 0 var(--spacing-2);letter-spacing:.02em}
.ul{margin-left:var(--spacing-6);color:var(--ink);font-size:var(--text-sm)}.ul li{margin:var(--spacing-2) 0}.ul b{font-weight:600}
.tip{position:fixed;transform:translateX(-50%);background:var(--ink);color:var(--white);font-size:var(--text-xs);font-weight:600;padding:var(--spacing-2) var(--spacing-3);border-radius:var(--radius-md);z-index:95;pointer-events:none;white-space:nowrap}
.tip kbd{background:transparent;color:var(--white);border-color:rgba(255,255,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--spacing-3);margin:var(--spacing-1) 0 var(--spacing-4)}
.stat{display:flex;align-items:center;gap:var(--spacing-3);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--spacing-4)}
.stat b{display:block;font-size:var(--text-lg);font-weight:600;line-height:1.2}.stat small{color:var(--muted);font-size:var(--text-sm);font-weight:600}

/* Browser check. Real detection from the user agent; the prototype control can force any browser. Non-Chrome is a warning, never a blocker. */
const BR_NAMES={chrome:'Google Chrome',edge:'Microsoft Edge',brave:'Brave',opera:'Opera',operamini:'Opera Mini',firefox:'Firefox',safari:'Safari',samsung:'Samsung Internet'};
function detectBrowser(){const u=navigator.userAgent||'';
  if(/Opera Mini|OPiOS/i.test(u))return 'operamini';
  if(/OPR\/|Opera/i.test(u))return 'opera';
  if(/Edg(e|A|iOS)?\//.test(u))return 'edge';
  if(/SamsungBrowser/i.test(u))return 'samsung';
  if(/Firefox|FxiOS/i.test(u))return 'firefox';
  if(navigator.brave)return 'brave';
  if(/Chrome|CriOS/i.test(u))return 'chrome';
  if(/Safari/i.test(u))return 'safari';
  return 'chrome'}
const brVer=b=>{const u=navigator.userAgent||'';const re={edge:/Edg(?:e|A|iOS)?\/(\d+)/,opera:/OPR\/(\d+)/,operamini:/Opera Mini\/(\d+)/,samsung:/SamsungBrowser\/(\d+)/,firefox:/(?:Firefox|FxiOS)\/(\d+)/,safari:/Version\/(\d+)/}[b]||/(?:Chrome|CriOS)\/(\d+)/;const m=u.match(re)||u.match(/(?:Chrome|CriOS)\/(\d+)/);return m?m[1]:''};
const curBrowser=()=>{const b=S.o.browser;return !b||b==='auto'?detectBrowser():b};
V.rules=()=>{
  let n=netRow();
  const needExt=!S.mobile&&S.o.type!=='seb';let extOk=S.o.ext!=='blocked',monOk=S.o.disp!=='multi';
  const key=S.net+'|'+S.o.ext+'|'+S.o.disp+'|'+S.mobile;const animate=S.chkKey!==key;S.chkKey=key;
  const netAnim=animate&&S.net!=='offline';
  const PK={'p-ok':'ok','p-warn':'warn','p-bad':'bad'};
  const busy='<span class="bdg bdg-idle"><span class="spin dk"></span>Checking…</span>';
  const ter=(attr)=>`<button class="btn sec" ${attr}>Check Again</button>`;
  const netSide=done=>`<div class="rcs" data-netside>${!done?busy:(S.net!=='offline'?`<div class="spd2 ${S.net==='good'?'g':'w'}"><span>${mi('download-01')}${n.dl}</span><span>${mi('upload-01')}${n.ul}</span></div>`:'')+'<button class="btn sec" data-recheck>Check Again</button>'}</div>`;
  const TK=`<span class="okc">${CKSVG}</span>`;
  const extSide=(done,tk)=>`<div class="rcs" data-extside>${!done?busy:extOk?(tk?TK:''):ter('data-extre')}</div>`;
  const monSide=(done,tk)=>`<div class="rcs" data-monside>${!done?busy:monOk?(tk?TK:''):ter('data-monre')}</div>`;
  const br=curBrowser(),brOk=br==='chrome'||S.o.type==='seb',brName=BR_NAMES[br];
  const brSide=(done,tk)=>`<div class="rcs" data-brside>${!done?busy:tk?TK:''}</div>`;
  const BR0=`You’re using ${brName}${brVer(br)?' v'+brVer(br):''}.`;
  const brDesc=()=>S.o.type==='seb'?'You’re in Safe Exam Browser.':brOk?BR0:`${BR0}<span style="display:block;color:var(--amber-t);font-weight:600">We recommend Google Chrome for the best experience.</span>`;
  const NET0='Use a stable, high-speed internet.';
  const netDesc=()=>NET0+(n.msg?`<span style="display:block;color:${S.net==='slow'||S.net==='tooslow'?'#D97F27':'var(--red)'};font-weight:600">${n.msg}</span>`:'');
  const EXT0='No blocked extensions detected.';
  const extDesc=()=>extOk?EXT0:`<span style="color:var(--red);font-weight:600">Turn off all browser extensions to continue.</span><ol class="rsteps"><li>Open your browser’s extension settings and turn off all extensions.</li><li>Return here and click Check Again.</li></ol>`;
  const MON0='Use one screen and disconnect any additional monitors.';
  const monDesc=()=>monOk?MON0:`<span style="color:var(--red);font-weight:600">Use one screen to continue.</span><ol class="rsteps"><li>Disconnect any additional monitors or displays.</li><li>Return here and click Check Again.</li></ol>`;
  const first=S.name.trim().split(/\s+/)[0];
  app.innerHTML=twoCol(`<h1 class="h1">Hi ${first}, before you begin</h1>
  <div class="card g">
   <div class="grp3"><div class="gl">What you’ll need</div>
    ${rowC('wifi','Internet Connection',netAnim?NET0:netDesc(),{l:1,attr:'data-netdesc',side:netSide(!netAnim)})}
    ${S.mobile?'':rowC('globe','Browser Compatibility',brDesc(),{l:1,attr:'data-brdesc',side:brSide(!animate)})}
    ${needExt?rowC('shield','Browser Extensions',animate?EXT0:extDesc(),{l:1,attr:'data-extdesc',side:extSide(!animate)}):''}
    ${needExt?rowC('monitor2','Single Screen',animate?MON0:monDesc(),{l:1,attr:'data-mondesc',side:monSide(!animate)}):''}
    ${S.mobile?rowC('appwin','Fullscreen','Opens in fullscreen. No camera or screen sharing.',{l:1}):
      ''}
   </div>
   <div class="grp3"><div class="gl">Get your space ready</div>
    ${rowC('sun','Room','Quiet and well lit, so your face is clear.')}${rowC('appwin','Apps','Close other tabs and apps. Turn off notifications.')}${rowC('plug','Power','Plug in your charger, or fully charge.')}
   </div></div>`);
  $$('[data-copylink]',app).forEach(b=>b.onclick=()=>toast('Link copied'));
  const state=()=>{const ok=!netBad()&&(!needExt||(extOk&&monOk));return [ok,S.net==='offline'?'Please check your internet connection and try again.':S.net==='tooslow'?'Your internet is too slow.':needExt&&!extOk?'Turn off the blocked extension to continue.':needExt&&!monOk?'Disconnect the extra monitor to continue.':`${2+(needExt?2:0)} of ${2+(needExt?2:0)} checks passed`]};
  const f=footer({label:'Continue',wide:1,onNext:()=>{if(blocked())return;const [ok,msg]=state();if(!ok){toast(msg);return}next()},enabled:!animate&&state()[0],hint:animate?'Checking your setup…':state()[1]});
  const ROWS={net:['[data-netside]','[data-netdesc]',NET0,()=>{n=netRow();return [netSide(true),netDesc()]}],
    ext:['[data-extside]','[data-extdesc]',EXT0,()=>{extOk=S.o.ext!=='blocked';return [extSide(true,1),extDesc()]}],
    mon:['[data-monside]','[data-mondesc]',MON0,()=>{monOk=S.o.disp!=='multi';return [monSide(true,1),monDesc()]}]};
  const busyRows=new Set();
  const recheck=(sel,k)=>{const b=$(sel,app);if(b)b.onclick=async()=>{if(busyRows.has(k))return;busyRows.add(k);const [sd,dd,d0,get]=ROWS[k],ep=epoch;
    b.disabled=true;b.innerHTML='<span class="spin dk"></span>'+(k==='net'?'Testing…':'Checking…');f.upd(false,'Checking…');
    await sleep(1200);busyRows.delete(k);if(ep!==epoch)return;
    const [side,desc]=get();$(sd,app).outerHTML=side;$(dd,app).innerHTML=desc;
    S.chkKey=S.net+'|'+S.o.ext+'|'+S.o.disp+'|'+S.mobile;bind();busyRows.size?f.upd(false,'Checking…'):finish()}};
  const bind=()=>{recheck('[data-recheck]','net');recheck('[data-extre]','ext');recheck('[data-monre]','mon')};
  const finish=()=>{if(needExt){S.ok.ext=extOk;if(!extOk)consume('ext');if(!monOk)consume('disp')}const [ok,msg]=state();f.upd(ok,msg)};
  bind();
  if(!animate){finish();return}
  const ep=epoch;setTimeout(()=>{if(ep!==epoch)return;
    if(netAnim){$('[data-netside]',app).outerHTML=netSide(true);$('[data-netdesc]',app).innerHTML=netDesc()}
    if(!S.mobile){$('[data-brside]',app).outerHTML=brSide(true,1);$('[data-brdesc]',app).innerHTML=brDesc()}
    if(needExt){$('[data-extside]',app).outerHTML=extSide(true,1);$('[data-extdesc]',app).innerHTML=extDesc();$('[data-monside]',app).outerHTML=monSide(true,1);$('[data-mondesc]',app).innerHTML=monDesc()}
    bind();finish()},1500);
};

/* pop-up that walks through camera, microphone and screen sharing */
function openChecks(done){
  const main=app,list=pmList(),se=S.enter;const dn=k=>k==='cam'?!!S.ok.cam:k==='mic'?S.ok.mic===true:!!S.ok.screen;let i=list.findIndex(k=>!dn(k));if(i<0){done();return}
  const back=document.createElement('div');back.className='pmback';
  back.innerHTML='<div class="pmodal" role="dialog" aria-modal="true" aria-label="Permissions and checks"><div id="pmapp" class="pmapp"></div><button class="pmx" data-pmcancel aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D584C" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  $('#overlay').appendChild(back);const host=$('#pmapp',back);
  const live=setInterval(()=>{const rows=main.querySelectorAll('.rcrow');[S.ok.cam,S.ok.mic===true,S.ok.screen].forEach((ok,k)=>{const r=rows[k];if(ok&&r&&!r.querySelector('.rcs'))r.insertAdjacentHTML('beforeend','<div class="rcs"><span class="okc keep">'+CKSVG+'</span></div>')})},200);
  const close=()=>{clearInterval(live);epoch++;window.__pm=null;app=main;back.remove();S.enter=se};$('[data-pmcancel]',back).onclick=close;
  const show=()=>{epoch++;app=host;V[list[i]]();};
  window.__pm={adv(){i++;if(i<list.length)show();else{close();done()}}};
  show();
}

/* ---------- camera ---------- */
function exTiles(){
  const I=(n,x,y,w,h,abs)=>`<img src="${A[n]}" alt="" width="${w}" height="${h}" style="left:${abs?x+'px':`calc(50% + ${x}px)`};top:${y}px;width:${w}px;height:${h}px">`;
  const T=(cls,label,ok,imgs)=>`<figure><div class="tile ${cls}">${imgs}<span class="bd ${ok?'ok':''}">${mi(ok?'check-badge':'x-close')}</span></div><figcaption>${label}</figcaption></figure>`;
  return `<div class="ex2" aria-label="Examples">${
    T('dark','Too dark',0,I('ex-dark-body',-51,79,100,102)+I('ex-dark-head',-21,35,40,40))}${
    T('','More than one person',0,I('ex-body-small',-91,89,70,102)+I('ex-head-small',-70,57,28,28)+I('ex-body',-11,79,100,102)+I('ex-head',19,35,40,40))}${
    T('','Face cut off',0,I('ex-body',-51,79,100,102,1)+I('ex-head',-21,35,40,40,1))}${
    T('','Clear and well lit',1,I('ex-ok-body',-51,79,100,102)+I('ex-head',-21,35,40,40))}</div>`;
}
function fitCam(){$$('.cam2').forEach(c=>{const st=c.firstElementChild;if(!st)return;const off=452+(document.querySelector('.vlist')?106:0),k=Math.max(.45,Math.min(1,(innerHeight-off)/360,c.clientWidth/512));c.style.height=Math.round(360*k)+'px';st.style.transform='scale('+k+')'})}
addEventListener('resize',fitCam);
function camView(v,o={}){
  const _w=0;
  const P=(n,x,y,w,h,abs)=>`<img src="${A[n]}" alt="" style="left:${abs?x+'px':`calc(50% + ${x}px)`};top:${y}px;width:${w}px;height:${h}px">`;
  let s='';
  if(v==='cut')s=P('cam-head',-30,40,98,98,1)+P('cam-body',-108,170,254,260,1);
  else{if(v==='multi')s=P('cam-head',150,120,70,70)+P('cam-body',95,230,180,190);
    s+=P('cam-head',-49,93,98,98)+P('cam-body',-127,222,254,260);if(o.guide)s+=P('face-guide',-82,40,164,204)}
  if(v==='dark')s+='<span class="dim"></span>';

}
function fixBox(msg,warn,tabsFor){

  const tabs=tabsFor?`<div class="tabs">${['chrome','safari','firefox'].map(k=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${{chrome:'Chrome / Edge',safari:'Safari',firefox:'Firefox'}[k]}</button>`).join('')}</div><ol>${TAB_STEPS[S.tab].map(t=>`<li>${t.replace('{x}',tabsFor).replace('{X}',tabsFor[0].toUpperCase()+tabsFor.slice(1))}</li>`).join('')}</ol>`:'';
  return `<div class="fix ${warn?'warn':'bad'}" role="status"><div>${msg}</div>${tabs}</div>`;
}
function setCta(btn,o){
  btn.disabled=!!o.dis;btn.className='btn big '+(o.cls||'');
  btn.innerHTML=(o.mi?mi(o.mi):'')+(o.icon?ic(o.icon):'')+(o.spin?'<span class="spin"></span>':'')+(o.check?`<svg class="ic ck" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12l4 4 10-10" fill="none"/></svg>`:'')+o.label;
}
const ACTS=(sec='<button class="btn sec big" data-prev>Back</button>')=>`<div class="acts">${sec}<button data-cta></button></div>`;
const bhtml=b=>`<button class="btn big ${b.sec?'sec':''} ${b.cls||''}" ${b.dis?'disabled':''} data-${b.id}>${b.mi?mi(b.mi):''}${b.spin?'<span class="spin"></span>':''}${b.label}</button>`;
const brow=a=>`<div class="acts">${a.map(bhtml).join('')}</div>`;
const CAM_PERM={blocked:'CAM_BLOCKED',dismissed:'CAM_DISMISSED',notfound:'CAM_NONE',inuse:'CAM_INUSE',osblocked:'CAM_OS'};
const CKSVG='<svg class="ic ck" viewBox="2 2 20 20" style="stroke-width:1.9"><path d="M5 12l4 4 10-10" fill="none"/></svg>';
/* allow → waiting → (permission error) → photo (3-2-1) → review → verifying; returning candidates get a quick check */
V.cam=()=>{
  const ep=epoch;let mode='ask',fix=null,view='ok',dark=false,cd=3,perm=null,vs=null;
  /* one verify press runs all three checks in sequence */
  const VL=()=>{const en=S.enrolled;return [['Camera Check','Checking…','Working'],['Face Enrollment',en?'Finding your photo…':'Enrolling…',en?'Already enrolled':'Enrolled'],['Face Verification','Verifying…','Verified']]};
  const vitem=(k,anim)=>{const x=VL()[k],st=vs[k];return `<li class="${st}${anim?'':' still'}"><span class="vi">${st==='run'?'<span class="spin dk"></span>':st==='done'?CKSVG:st==='fail'?mi('x-close'):k+1}</span><div><b>${x[0]}</b><small>${st==='done'?x[2]:st==='run'?x[1]:st==='fail'?'Didn’t pass':'Waiting'}</small></div></li>`};
  const vlist=()=>`<ul class="vlist v2" role="status" aria-live="polite">${VL().map((x,k)=>vitem(k,false)).join('')}</ul>`;
  const updV=k=>{const li=$$('.vlist li',cc)[k];if(li)li.outerHTML=vitem(k,true)};
  app.innerHTML=`<div class="cwrap n">`+mini('cam')+`<div class="card dcard" id="cc"></div></div>`;
  const cc=$('#cc');
  const draw=()=>{
    const en=S.enrolled;
    const head=`<div class="chd"><h2>Check your camera</h2><p>Make sure your face is clear and well lit.</p></div>`;
    const stuck=S.camTries>=3&&(mode==='perm'||fix)?`<p class="stuck">Still not working? <button class="link" data-gethelp>Get help</button></p>`:'';
    let h='';
    if(mode==='req')h=permCard('cam')+brow([{id:'cta',label:'Request Permission'}]);
    else if(mode==='ask'||mode==='wait')h=`<div class="chd"><h2>Check your camera</h2><p>Make sure your face is clearly visible, well-lit, and alone in the frame.</p></div>`+exTiles()
      +brow([mode==='wait'?{id:'cta',label:'Waiting for your permission…',spin:1,cls:'busy',dis:1}:{id:'cta',label:'Okay, Got it'}]);
    else if(mode==='perm')h=fixBox(fix,false,perm==='blocked'?'camera':null)+stuck+brow([{id:'cta',label:'Try Again'}]);
    else{
      const live=mode==='live'||mode==='quick'||mode==='count',cap=mode==='captured'||(mode==='verifying'&&!en);
      h=head+camView(view,{guide:live&&!fix&&view!=='cut',tag:live||(mode==='verifying'&&en),count:mode==='count'?cd:0})
       +(vs?vlist():`<p class="ptxt">${cap?'Is your face, background is clear and easy to visible?':en?'Your face is already set up. Quick check.':'We’ll check your camera, verify your identity, and then enroll your face.'}</p>`)
       +(fix?fixBox(fix,false):dark&&mode!=='ok'?fixBox(MSG.CAM_DARK_NOTE,true):'')+stuck
       +(mode==='live'?brow([{id:'cta',label:fix?'Retake':'Capture'}])
        :mode==='count'?brow([{id:'cta',label:`Capturing in ${cd}…`,cls:'busy',dis:1}])
        :mode==='captured'?brow([{id:'retake',label:'No, Retake',sec:1},{id:'cta',label:'Yes, Verify'}])
        :mode==='quick'?brow([{id:'cta',label:fix?'Try Again':'Verify'}])
        :mode==='verifying'?brow([{id:'cta',label:'Verifying...',cls:'busy',dis:1}])
        :brow([{id:'cta',label:CKSVG+'Looks good',cls:'ok',dis:1}]));
    }
    cc.innerHTML=h;fitCam();
    const cta=$('[data-cta]',cc);if(cta)cta.onclick=act;
    const rt=$('[data-retake]',cc);if(rt)rt.onclick=()=>{mode='live';fix=null;view='ok';vs=null;draw()};
    const gh=$('[data-gethelp]',cc);if(gh)gh.onclick=openHelp;
    S.enter=['wait','count','verifying','ok'].includes(mode)?null:act;
    $$('[data-tab]',cc).forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;draw()});
  };
  async function act(){
    if(blocked())return;
    if(mode==='req'||(mode==='ask'&&!S.perm.cam)||(mode==='perm'&&!S.perm.cam)){
      fix=null;mode='wait';draw();
      return reqPerm('cam',ok=>{if(ep!==epoch)return;if(ok){mode='ask';act()}else{perm='dismissed';fix=MSG.CAM_DISMISSED;mode='perm';S.camTries++;draw()}})}
    if(mode==='ask'||mode==='perm'){
      fix=null;
      const c=S.o.cam;
      if(CAM_PERM[c]){perm=c;fix=MSG[CAM_PERM[c]];mode='perm';S.camTries++;consume('cam');return draw()}
      dark=c==='dark';if(dark)consume('cam');
      mode=S.enrolled?'quick':'live';view='ok';return act()}
    if(mode==='live'){
      fix=null;view='ok';mode='count';cd=3;draw();
      while(cd>1){await sleep(800);if(ep!==epoch)return;cd--;draw()}
      await sleep(800);if(ep!==epoch)return;mode='captured';return act()}
    if(mode==='captured'||mode==='quick'){
      const en=S.enrolled,fc=S.o.face,failAt=fc==='ok'?-1:(fc==='nomatch'||en)?2:0;
      mode='verifying';fix=null;view='ok';vs=['run','wait','wait'];draw();
      for(let i=0;i<3;i++){
        vs[i]='run';if(i)updV(i);await sleep(i===1&&en?500:900);if(ep!==epoch)return;
        if(i===failAt){vs[i]='fail';updV(i);await sleep(900);if(ep!==epoch)return;
          S.camTries++;consume('face');fix=MSG['FACE_'+fc];view=fc==='multiple'?'multi':fc==='none'?'cut':fc==='dark'?'dark':'ok';mode=en?'quick':'live';vs=null;return draw()}
        vs[i]='done';updV(i)}
      S.enrolled=true;S.camTries=0;S.ok.cam=true;mode='ok';if(S.banner===MSG.CAM_UNPLUGGED){S.banner=null;banners()}draw();
      await sleep(1300);if(ep!==epoch)return;next()}
  }
  draw();permKnown('cam',()=>{if(ep===epoch&&mode==='req'){mode='ask';draw()}});
};

/* ---------- microphone ---------- */
V.mic=()=>{
  const ep=epoch;let mode='ready',fix=null,warn=false,heard=null,stopped=false,playing=false,cd=6;
  app.innerHTML=`<div class="cwrap n">`+mini('mic')+`<div class="card dcard" id="mc"></div></div>`;
  const mc=$('#mc');
  const head=`<div class="chd"><h2>Check your microphone</h2><p>Say the sentence below when recording starts.</p></div>`;
  const pad=n=>String(Math.max(0,n)).padStart(2,'0');
  const opt=S.o.micMode==='optional';
  const bars=(on)=>`<div class="mwave ${on?'wv-on':''}" aria-hidden="true">${Array.from({length:31},(_,k)=>`<i style="--d:${(k*137%11)/10}s;--h:${10+Math.round(34*Math.abs(Math.sin(k*.62+1)))}px"></i>`).join('')}</div>`;
  const viz=(on)=>`<div class="mrec" ${on?'role="status" aria-label="Recording in progress"':''}>
        <span class="mcore">${mi('microphone-01')}</span>
        <div class="mtext"><span class="s1">Speak out loud</span><span class="s2">“I am ready to start the assessment”</span></div>
        ${bars(on)}</div>`;
  const draw=()=>{
    let h='';
    if(mode==='req')h=permCard('mic')+brow([{id:'cta',label:'Request Permission'}]);
    else if(mode==='blocked'||mode==='none')h=fixBox(fix,false,mode==='blocked'?'microphone':null)+brow([{id:'cta',label:'Try Again'}]);
    else if(mode==='ready'||mode==='rec'||mode==='wait')h=head+viz(mode==='rec')
      +(mode==='rec'?brow([{id:'cta',label:`Stop Recording...${pad(cd)}`,sec:1,cls:'fullw'}]):brow([mode==='wait'?{id:'cta',label:'Waiting for your permission…',spin:1,cls:'busy',dis:1}:{id:'cta',label:'Start Recording'}]));
    else if(mode==='clear'&&!fix)h=head+viz(false)+brow([{id:'cta',label:CKSVG+'Microphone working',cls:'ok',dis:1}]);
    else h=head+(heard.empty?'':`<div class="hpan" style="margin-top:var(--spacing-6)"><button class="hplay" data-play aria-label="${playing?'Stop playback':'Play recording'}">${playing?ic('stop'):mi('play')}</button><div class="hw" aria-hidden="true">${Array.from({length:54},(_,k)=>`<i style="--h:${[12,20,32,24,16,28,36,22][k%8]}px"></i>`).join('')}</div><span class="ht">00:${pad(heard.sec||4)}</span></div>`)
      +`<div class="hsay" role="status"><small>What we heard:</small><div class="qt ${heard.empty?'empty':''}">${heard.t}</div></div>`
      +(fix?fixBox(fix,warn):'')
      +(mode==='clear'&&!fix?brow([{id:'cta',label:CKSVG+'Microphone working',cls:'ok',dis:1}]):mode==='clear'?brow([{id:'again',label:'Test Again',sec:1,dis:playing},{id:'cta',label:'Continue',dis:playing}]):brow([{id:'again',label:'Test Again',cls:'fullw',dis:playing}]));
    if(opt&&mode!=='rec'&&mode!=='clear')h+=`<div class="skipr"><button class="link" data-skip>Skip for now</button></div>`;
    mc.innerHTML=h;
    const cta=$('[data-cta]',mc);if(cta)cta.onclick=act;
    const ag=$('[data-again]',mc);if(ag)ag.onclick=()=>{if(playing)return;mode='ready';fix=null;heard=null;draw()};
    const sk=$('[data-skip]',mc);if(sk)sk.onclick=()=>{S.ok.mic='skipped';next()};
    S.enter=act;
    const pl=$('[data-play]',mc);if(pl)pl.onclick=async()=>{if(playing){playing=false;return draw()}playing=true;draw();const bs=$$('.hw i',mc),tot=Math.max(1,heard.sec||2)*1000,t0=performance.now();
      while(playing&&ep===epoch){const f=Math.min(1,(performance.now()-t0)/tot);bs.forEach((b,k)=>b.classList.toggle('b',k<Math.round(f*bs.length)));const ht=$('.ht',mc);if(ht)ht.textContent='00:'+pad(Math.ceil(tot*(1-f)/1000));if(f>=1)break;await sleep(40)}
      if(ep!==epoch||!playing)return;await sleep(250);if(ep!==epoch||!playing)return;playing=false;draw()};
    $$('[data-tab]',mc).forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;draw()});
  };
  async function act(){
    if(blocked())return;
    if(mode==='rec'){stopped=true;return}
    if(playing&&(mode==='clear'||mode==='fail'))return;
    if(mode==='req'||(mode==='ready'&&!S.perm.mic)||(mode==='blocked'&&!S.perm.mic&&S.o.mic!=='blocked')){mode='wait';draw();return reqPerm('mic',ok=>{if(ep!==epoch)return;if(ok){mode='ready';act()}else{mode='blocked';fix=MSG.MIC_BLOCKED;warn=false;heard=null;draw()}})}
    if(mode==='wait')return;
    if(mode==='clear'){S.ok.mic=true;return next()}
    if(mode==='fail'){mode='ready';fix=null;heard=null;return draw()}
    const pm=S.o.mic==='blocked'||S.o.mic==='notfound';
    if((mode==='blocked'||mode==='none')&&!pm){mode='ready';fix=null;return draw()}
    if(pm){const b=S.o.mic==='blocked';mode=b?'blocked':'none';fix=b?MSG.MIC_BLOCKED:MSG.MIC_NONE;warn=false;heard=null;consume('mic');return draw()}
    mode='rec';fix=null;heard=null;stopped=false;playing=false;cd=6;draw();
    for(let t=0;t<60&&!stopped;t++){await sleep(100);if(ep!==epoch)return;if(t%10===9){cd--;const b=$('[data-cta]',mc);if(b&&!stopped)b.textContent=`Stop Recording...${pad(cd)}`}}
    const o=S.o.mic;
    if(o==='clear'){mode='clear';heard={t:'“I am ready to start the assessment”'};fix=null}
    else if(o==='noisy'){mode='clear';heard={t:'“I am ready to start the assess…”'};fix=MSG.MIC_NOISY;warn=true;consume('mic')}
    else{mode='fail';heard={t:'Nothing heard',empty:true};fix=MSG.MIC_SILENT;warn=false;consume('mic')}
    if(heard&&!heard.empty)heard.sec=4;
    draw();
    if(mode==='clear'&&!fix){await sleep(1200);if(ep!==epoch)return;S.ok.mic=true;next()}
  }
  draw();permKnown('mic',()=>{if(ep===epoch&&mode==='req'){mode='ready';draw()}});
};

/* ---------- screen ---------- */
function thumbSVG(kind,i){
  const bg=['#E4E9F7','#F9EDE2','#EAF4EF'][i%3];
  if(kind==='tab')return `<svg viewBox="0 0 160 100"><rect width="160" height="100" fill="#F6F8FB"/><rect width="160" height="16" fill="#E7ECF5"/><rect x="6" y="4" width="34" height="12" rx="3" fill="#fff"/><rect x="10" y="26" width="140" height="64" rx="4" fill="${bg}"/><rect x="18" y="36" width="60" height="6" rx="3" fill="#fff" opacity=".8"/><rect x="18" y="48" width="100" height="4" rx="2" fill="#fff" opacity=".6"/></svg>`;
  if(kind==='window')return `<svg viewBox="0 0 160 100"><rect width="160" height="100" fill="#C9D5E9"/><rect x="${14+i*10}" y="12" width="110" height="76" rx="5" fill="#fff"/><rect x="${14+i*10}" y="12" width="110" height="12" rx="5" fill="#E7ECF5"/><rect x="${24+i*10}" y="34" width="60" height="6" rx="3" fill="${bg}"/></svg>`;
  return `<svg viewBox="0 0 160 100"><rect width="160" height="100" fill="#97B2ED"/><rect x="14" y="12" width="70" height="52" rx="4" fill="#fff" opacity=".92"/><rect x="92" y="20" width="52" height="38" rx="4" fill="#fff" opacity=".7"/><rect y="90" width="160" height="10" fill="#14233B"/></svg>`;
}
/* Simulated browser permission prompt (Chrome style, top-left). Asked once per device; later steps reuse the answer. */
function reqPerm(kind,cb){
  if(S.perm[kind])return cb(true);
  const fin=ok=>{if(ok)S.perm[kind]=true;cb(ok)},md=navigator.mediaDevices;
  if(!md||!md.getUserMedia)return fin(true);
  md.getUserMedia(kind==='cam'?{video:true}:{audio:true}).then(st=>{st.getTracks().forEach(t=>t.stop());fin(true)}).catch(e=>fin(!(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))));
}
function permKnown(kind,cb){
  try{navigator.permissions.query({name:kind==='cam'?'camera':'microphone'}).then(r=>{if(r.state==='granted'){S.perm[kind]=true;cb()}}).catch(()=>{})}catch(e){}
}
function permCard(kind){

  return `<div class="chd"><h2>${c?'Allow camera access':'Allow microphone permission'}</h2><p>${c?'Camera access is required to take this assessment. Please enable your device’s camera to proceed.':'Request permission for your microphone. When the notification appears, select ‘Allow’ to turn your microphone on.'}</p></div><div class="prq"><div class="pm" aria-hidden="true"><i style="width:80%"></i><i style="width:55%"></i><div class="r"><b></b><b></b></div></div></div>`;
}
function openPicker(cb){
  const sets={tab:['Topin Assessment','Docs','Mail'],window:['Notes','Terminal'],screen:['Screen 1']};
  const names={tab:'Chrome Tab',window:'Window',screen:'Entire Screen'};
  let kind='tab',sel=0;
  const back=h(`<div class="modal-back"><div class="picker" role="dialog" aria-label="Choose what to share"><div class="pk-h"><div class="pk-ic">${ic('monitor')}</div><div><b>Choose what to share</b><span>topin.tech wants to share the contents of your screen</span></div></div><div class="pk-tabs">${Object.keys(names).map(k=>`<button data-k="${k}">${names[k]}</button>`).join('')}</div><div class="pk-body"></div><div class="pk-f"><button class="c" data-c>Cancel</button><button class="s" data-s>Share</button></div></div></div>`);
  const render=()=>{$$('.pk-tabs button',back).forEach(b=>b.classList.toggle('on',b.dataset.k===kind));$('.pk-body',back).innerHTML=sets[kind].map((n,i)=>`<button class="thumbp ${i===sel?'sel':''}" data-i="${i}">${thumbSVG(kind,i)}<span>${n}</span></button>`).join('');$$('.thumbp',back).forEach(t=>t.onclick=()=>{sel=+t.dataset.i;render()})};
  $$('.pk-tabs button',back).forEach(b=>b.onclick=()=>{kind=b.dataset.k;sel=0;render()});
  $('[data-c]',back).onclick=()=>{back.remove();cb(null)};
  $('[data-s]',back).onclick=()=>{back.remove();cb(kind)};
  render();document.body.appendChild(back);
}
V.screen=()=>{
  const ep=epoch;let mode='idle',fix=null;
  app.innerHTML=`<div class="cwrap n">`+mini('screen')+`<div class="card dcard" id="sc"></div></div>`;
  const sc=$('#sc');
  const draw=()=>{
    sc.innerHTML=`<div class="chd">${mode==='ok'?'<h2>Your screen is shared</h2><p>You can proceed to the next step.</p>':'<h2>Share your entire screen</h2><p>To take this assessment, you need to share your entire screen.</p>'}</div><div class="shot2" aria-hidden="true"><div class="tb"><span>Chrome Tab</span><span>Window</span><span class="on">Entire Screen</span></div><div class="bd"><div class="th">${thumbSVG('screen',0)}Screen 1</div></div></div>`+(mode==='ok'?`<div class="fix sw" role="note" style="margin-top:var(--spacing-4)"><div>Do not click “Stop sharing” during the exam. This will terminate your assessment. Use “Hide” to hide the screen-sharing toolbar.</div></div>`:'')+fixBox(fix,false)
      +(mode==='multi'?brow([{id:'disc',label:'I’ve disconnected it'}]):ACTS(''));
    const d=$('[data-disc]',sc);
    if(d){d.onclick=()=>{if(S.o.scr==='multi')S.o.scr='ok';S.o.disp='one';buildControls();act()};S.enter=d.onclick;return}
    const b=$('[data-cta]',sc);
    setCta(b,mode==='wait'?{label:'Sharing…',spin:1,dis:1,cls:'busy'}:mode==='ok'?{label:'Next'}:mode==='fail'?{label:'Share Again'}:{label:'Share Screen'});
    b.onclick=mode==='ok'?next:act;S.enter=mode==='wait'?null:mode==='ok'?next:act;
  };
  function act(){
    if(blocked())return;
    mode='wait';fix=null;draw();
    const fin=r=>{
      if(ep!==epoch)return;
      if(r!=='ok'&&r!=='multi'){mode='fail';fix=MSG['SCREEN_'+r];consume('scr');draw();return}
      if(r==='multi'||S.o.disp==='multi'){mode='multi';fix=MSG.SCREEN_multi;draw();return}
      mode='ok';S.ok.screen=true;if(S.banner===MSG.SCREEN_STOPPED){S.banner=null;banners()}draw();
    };
    /* normal case: the browser's own picker decides; a forced prototype outcome still wins */
    if(S.o.scr==='ok'||S.o.scr==='multi')openPicker(k=>fin(k===null?'cancelled':k==='screen'?S.o.scr:k));
    else (async()=>{await sleep(1300);fin(S.o.scr)})();
  }
  draw();
};

   {k:'ext',icon:'shield',t:'Browser Extensions',d:S.ok.ext?'No blocked extensions found':S.o.ext==='blocked'?'Turn off Grammarly':'Not checked',ok:S.ok.ext,step:'rules'},
   {k:'mon',icon:'monitor2',t:'Multiple Monitors',d:S.o.disp==='multi'?'Second screen detected':'No extra screen detected',ok:S.o.disp!=='multi',step:'rules'},
   {k:'cam',icon:'camera',t:'Camera',d:S.ok.cam?'Camera on, Identity confirmed':'Not verified',ok:S.ok.cam,step:'cam'},

V.review=()=>{
  const rows=reviewRows();const nb=rows.filter(r=>!r.ok).length,okN=rows.length-nb;
  const spd=r=>`<div class="spd2 ${S.net==='good'?'g':'w'}"><span>${mi('download-01')}${r.speed[0]}</span><span>${mi('upload-01')}${r.speed[1]}</span></div>`;
  const netSide=r=>`<div class="rcs" data-rnet>${r.ok&&r.speed?spd(r):!r.ok?badge('bad','Needs attention',ic('warn')):''}<button class="btn sec" data-nettest>Check Again</button></div>`;
  const STEPS={ext:['Blocked extensions must be turned off.',['Open your browser’s extensions page (<b>chrome://extensions</b>).','Turn off ad blockers, writing assistants and screen recorders.','Come back and press Check Again.']],mon:['Use one screen, Disconnect extra monitors.',['Unplug any extra monitor, TV or projector.','Turn off screen mirroring or wireless display.','Come back and press Check Again.']]};
  const desc=r=>r.ok||!STEPS[r.k]?r.d:`<span style="color:var(--red);font-weight:600">${STEPS[r.k][0]}</span><ol class="rsteps">${STEPS[r.k][1].map(t=>`<li>${t}</li>`).join('')}</ol>`;
  const side=r=>r.k==='net'?netSide(r):!r.ok&&STEPS[r.k]?`<div class="rcs"><button class="btn sec" data-recheck-${r.k}>Check Again</button></div>`:r.ok?(r.speed?`<div class="rcs"><div class="spd2 ${S.net==='good'?'g':'w'}"><span>${mi('download-01')}${r.speed[0]}</span><span>${mi('upload-01')}${r.speed[1]}</span></div></div>`:''):`<div class="rcs">${badge('bad','Needs attention',ic('warn'))}${r.step?`<button class="btn sec" data-fixone="${r.step}">Fix</button>`:''}</div>`;
  app.innerHTML=twoCol(`<div class="ttlrow"><h1 class="h1">${nb?'Fix these to continue':'Everything is set'}</h1>${nb?`<span class="pill2 bad" role="status">${ic('warn')}${nb} ${nb===1?'Needs':'Need'} Attention</span>`:`<span class="pill2" role="status">${mi('check-circle')}${okN} of ${rows.length} Checks Passed</span>`}</div>
  <div class="card g">${rows.map(r=>rowC(r.icon,r.t,desc(r),{l:1,side:side(r),attr:`data-rd="${r.k}"`})).join('')}</div>`);
  $$('[data-fixone]',app).forEach(b=>b.onclick=()=>{S.returnTo='review';go(b.dataset.fixone)});
  /* Test Again re-runs only the internet row */
  const bindNet=()=>{const b=$('[data-nettest]',app);b.onclick=async()=>{const ep=epoch,was=rows[0].ok;b.disabled=true;b.innerHTML='<span class="spin dk"></span>Testing…';
    await sleep(1200);if(ep!==epoch)return;const r=reviewRows()[0];if(r.ok!==was)return render();
    const row=$('[data-rnet]',app).closest('.rcrow');row.outerHTML=rowC(r.icon,r.t,r.d,{side:netSide(r)});bindNet()}};
  bindNet();
  /* Check Again for extensions / monitors re-checks in place */
  ['ext','mon'].forEach(k=>{const b=$(`[data-recheck-${k}]`,app);if(!b)return;b.onclick=async()=>{const ep=epoch;b.disabled=true;b.innerHTML='<span class="spin dk"></span>Checking…';
    await sleep(1200);if(ep!==epoch)return;
    if(k==='ext'){if(S.o.ext!=='blocked')S.ok.ext=true;else consume('ext')}else{if(S.o.disp==='multi')consume('disp')}
    if(reviewRows().find(r=>r.k===k).ok)return render();
    b.disabled=false;b.textContent='Check Again'}});
  const first=rows.find(r=>!r.ok&&r.step)||rows.find(r=>!r.ok);
  const f=footer({label:'Continue',wide:1,onNext:()=>{if(!blocked())next()},enabled:allOk(),hint:allOk()?'':'Something needs attention.'});
  if(!allOk()&&first){f.hint.innerHTML=`<button class="link" data-fix>Go to the first item that needs attention</button>`;$('[data-fix]',f.hint).onclick=()=>{if(['ext','mon','net'].includes(first.k)){const row=$(`[data-rd="${first.k}"]`,app);const r=row&&row.closest('.rcrow');if(r){r.scrollIntoView({behavior:'smooth',block:'center'});r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1200)}return}S.returnTo='review';go(first.step)}}
};

/* ---------- sections ---------- */
function secCtx(){
  const L=SECS.map((x,i)=>[x,i]).filter(([x])=>!(S.mobile&&x.k!=='MCQ'));
  const cur=L.find(([x,i])=>!S.done.includes(i));const nd=L.filter(([x,i])=>S.done.includes(i)).length;
  const totalS=L.reduce((a,[x])=>a+x.t*60,0);const left=S.atRun?S.atLeft:totalS;const tot=L.length;const first=S.name.split(' ')[0];
  const hd=nd===0?['You’re ready, '+first+'.','Take it one section at a time. Your assessment timer is running.']:nd===tot?['All sections done.','Great work. You can end the assessment now.']:nd===tot-1?['Last one, '+first+'. Finish strong.','One section to go. The hard part is behind you.']:['Nice pace, '+first+'.',`${tot-nd} sections to go. Keep the momentum.`];
  return {L,cur,nd,left,tot,hd,bad:!allOk()};
}
const sFix=c=>c.bad?`<div class="fix bad" role="alert" style="margin:0"><b>One thing needs attention.</b> Fix it before you start a section. <button class="link" data-fix style="padding:0 0 0 var(--spacing-1);min-height:0">Go to review</button></div>`:'';

/* Sections list variants: A cards · B timeline · C compact table · D tiles */
function secBody(v,c,row,meta){
  const note=`<div class="note2">${ic('info')}Sections open in order. Once you end a section, you can’t go back to it.</div>`;
  const st=i=>S.done.includes(i)?'done':c.cur&&c.cur[1]===i?'cur':'lock';
  const chip=x=>`<span class="fchip ${x.k==='Coding'?'code':''}">${x.k}</span>`;
  /* the tag stays glued to the last word of the name, so it never sits alone on a new line */
  const nm=x=>{const i=x.n.lastIndexOf(' ');return `<b>${x.n.slice(0,i+1)}</b><span class="nw"><b>${x.n.slice(i+1)}</b> ${chip(x)}</span>`};
  const ind=(i,k)=>st(i)==='done'?CKSVG:st(i)==='cur'?k+1:ic('lock');
  if(v==='b')return `<div class="card g"><ol class="stl">${c.L.map(([x,i],k)=>{const t=st(i),qs=`${x.q} ${x.q===1?'Question':'Questions'}`;
    if(t==='cur')return `<li class="cur"><span class="stl-dot">${k+1}</span><div class="stl-b"><div class="stl-panel">
      <div class="stl-h"><span class="stl-n">${nm(x)}</span></div>
      <div class="stl-stats"><div><small>Total Questions</small><b>${x.q}</b></div><div><small>Duration</small><b>${x.t} Min</b></div><div><small>Answer Type</small><b>${x.type}</b></div></div></div></div></li>`;
    return `<li class="${t}"><span class="stl-dot">${ind(i,k)}</span><div class="stl-b"><div class="stl-h"><span class="stl-n">${nm(x)}</span><span class="stl-s">${t==='done'?badge('ok','Submitted'):`<span class="stl-m2">${qs} · ${x.t} Min</span>`}</span></div></div></li>`}).join('')}</ol>${note}</div>`;
  if(v==='c')return `<div class="card g ctbl"><div class="ct-h"><span>Section</span><span>Questions</span><span>Duration</span><span>Status</span></div>${c.L.map(([x,i],k)=>{const t=st(i);return `<div class="ct-r ${t}"><span class="ct-n"><span class="sind2">${ind(i,k)}</span><b>${x.n}</b>${chip(x)}</span><span>${x.q}</span><span>${x.t} Min</span><span>${t==='done'?badge('ok','Submitted'):t==='cur'?badge('idle','Up next'):`<span class="tlock">${ic('lock')}Locked</span>`}</span></div>`}).join('')}${note}</div>`;
  if(v==='d')return `<div class="stiles">${c.L.map(([x,i],k)=>{const t=st(i);return `<div class="stile ${t}"><div class="st-top"><span class="sind2">${ind(i,k)}</span>${chip(x)}${t==='done'?`<span class="st-s">${badge('ok','Submitted')}</span>`:t==='cur'?`<span class="st-s">${badge('idle','Up next')}</span>`:''}</div><b>${x.n}</b><dl><div><dt>Questions</dt><dd>${x.q}</dd></div><div><dt>Duration</dt><dd>${x.t} Min</dd></div></dl></div>`}).join('')}</div><p class="snote">${ic('info')}Sections open in order. Once you end a section, you can’t go back to it.</p>`;
  return `<div class="card g"><div class="grp3">${c.L.map(row).join('')}</div>${note}</div>`;
}
const fmtHMS=n=>{n=Math.max(0,n);return Math.floor(n/3600)+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};

function liveView(){
  window.__startRefresh=null;app.classList.remove('wide');epoch++;S.enter=null;const s=SECS[S.sec];let secs=s.t*60;
  app.innerHTML=`<div class="live"><div class="lv-top"><div class="crumb">Full-Stack Developer Assessment ${ic('arrow')} <b>${s.n}</b></div><div class="pills"><span class="chip">${ic('camera')}Camera</span>${SCREEN_SHARE?`<span class="chip">${ic('monitor')}Screen shared</span>`:''}<span class="chip">${ic('mic')}Mic</span></div></div>
   <div class="lv-body"><div class="lq"><span class="chip" style="align-self:flex-start;background:var(--blue-m);color:var(--blue-t)">Question 1 of ${s.q}</span><h3>A train 150 m long passes a pole in 15 seconds. What is its speed?</h3><p>Convert the speed to km/h. Use 1 m/s = 3.6 km/h.</p></div>
   <div class="lo">${['36 km/h','45 km/h','54 km/h','60 km/h'].map((t,i)=>`<button class="opt"><i>${'ABCD'[i]}</i>${t}</button>`).join('')}</div></div>
   </div>`;
  $$('.opt',app).forEach(b=>b.onclick=()=>{$$('.opt',app).forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  const he=$('#hend');he.hidden=false;$('#htimer').hidden=false;he.onclick=openEndSection;
  const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  const tick=()=>{const hv=$('#htv');if(hv){hv.removeAttribute('data-at');hv.textContent=f(secs);const ht=$('#htimer');ht.classList.toggle('warn',secs<300&&secs>=60);ht.classList.toggle('crit',secs<60)}const e2=$('[data-t2]',app);if(e2)e2.textContent=f(secs);if(secs>0)secs--};tick();clearInterval(timerIv);timerIv=setInterval(tick,1000);
  window.scrollTo(0,0);
}

/* ---------- end assessment ---------- */
const WKI={
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 out:'<path d="m16 17 5-5-5-5m5 5H9m0 9H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
 warn:'<path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>'};
const wki=(k)=>`<svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${WKI[k]}</svg>`;
/* Wavekit Modal / Type=Horizontal (and Destructive horizontal): featured icon + title + supporting text, close X, Secondary + Primary (md) */
function wkModal({title,body,icon='warn',cancel,ok,onOk,danger=false}){
  const el=h(`<div class="wk-back"><div class="wkm" role="dialog" aria-modal="true" aria-label="${title}"><button class="wkm-x" data-s aria-label="Close">${wki('x')}</button><div class="wkm-h"><span class="wkm-ic">${wki(icon)}</span><div class="wkm-t"><b>${title}</b><span>${body}</span></div></div><div class="wkm-f">${cancel?`<button class="btn sec" data-s>${cancel}</button>`:''}<button class="btn${danger?' danger':''}" data-o>${ok}</button></div></div></div>`);
  const close=()=>{el.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc);
  $$('[data-s]',el).forEach(b=>b.onclick=close);$('[data-o]',el).onclick=()=>{close();onOk()};
  document.body.appendChild(el);($('[data-s].btn',el)||$('[data-o]',el)).focus();
}
function dialog(title,body,cancel,ok,onOk,danger){wkModal({title,body,icon:'warn',cancel,ok,onOk,danger:!!danger})}
function openEndSection(){
  const s=SECS[S.sec];
  dialog(`End ${s.n}?`,'You can\u2019t return to this section. Unanswered questions get 0 marks.','Keep working','End Section',()=>{if(!S.done.includes(S.sec))S.done.push(S.sec);go('sections');toast(`${s.n} submitted. Your answers are saved.`)},true);
}
function openEnd(){
  const c=secCtx(),left=c.tot-c.nd;
  const body=left?`${left} ${left===1?'section':'sections'} you haven\u2019t started will be submitted with no answers. You can\u2019t return.`:'All your sections are submitted. This finishes your assessment.';
  dialog('End Assessment?',body,'Cancel','End Assessment',()=>{S.atRun=false;footer(null);$('#steps').innerHTML='';$('#bans').innerHTML='';
    app.innerHTML=`<div class="gate"><div class="card"><h1 class="h1">Assessment submitted</h1><p class="sub">${c.nd} of ${c.tot} sections completed. You can close this window.</p></div></div>`},true);
}
/* ---------- logout ---------- */
function openLogout(){wkModal({title:'Log out?',body:'You can sign in again with the correct account using the same assessment link.',icon:'out',cancel:'Stay signed in',ok:'Log out',danger:true,onOk:()=>toast('Logging out… taking you to the login page.')})}
/* ---------- session modals ---------- */
let sessIv=null;
function closeSess(){clearInterval(sessIv);$$('.sessback').forEach(e=>e.remove());document.body.classList.remove('sess-open')}
function openSigned(){
  closeSess();const first=S.name.trim().split(/\s+/)[0];let left=30;
  const el=h(`<div class="modal-back sessback"><div class="sdlg" role="alertdialog" aria-modal="true" aria-labelledby="sdt">
    <span class="sdi">${mi('sd-monitor')}</span>
    <h2 class="sdh" id="sdt">${first}, you’re signed in elsewhere</h2>
    <p>Your account just opened on another device. Use it here to continue, or log out to go back to the login page.</p>
    <span class="sdtm" role="timer" aria-label="Time left to choose">${mi('clock')}<b>00 : 30</b></span>
    <div class="sdf"><button class="btn big sec" data-lo>Logout</button><button class="btn big" data-use>Use Here</button></div></div></div>`);
  const tm=$('.sdtm',el),tb=$('b',tm);
  const out=()=>{closeSess();toast('Logging out… taking you to the login page.')};
  $('[data-use]',el).onclick=()=>{closeSess();toast('Continuing on this device')};
  $('[data-lo]',el).onclick=out;
  sessIv=setInterval(()=>{left--;tb.textContent='00 : '+String(Math.max(0,left)).padStart(2,'0');tm.classList.toggle('low',left<=10);if(left<=0)openExpired()},1000);
  document.body.classList.add('sess-open');document.body.appendChild(el);$('[data-use]',el).focus();
}
function openExpired(){
  closeSess();
  const el=h(`<div class="modal-back sessback"><div class="sdlg" role="alertdialog" aria-modal="true" aria-labelledby="sxt">
    <span class="sdi">${mi('sd-clock')}</span>
    <h2 class="sdh" id="sxt">Session Expired</h2>
    <p>Your session has expired. Please reload the window to continue.</p>
    <div class="sdf"><button class="btn big" data-rl>Reload</button></div></div></div>`);
  $('[data-rl]',el).onclick=()=>{closeSess();restart()};
  document.body.classList.add('sess-open');document.body.appendChild(el);$('[data-rl]',el).focus();
}
/* Report a problem lives in its own flow: the Report button and every Get help link only hand off to it */
function openHelp(){toast('Opens the Report a problem flow')}
$('#help-btn').onclick=openHelp;

document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-prev]'))prev()});
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.defaultPrevented)return;
  if(document.querySelector('.drawer,.modal-back'))return;
  const t=e.target;if(t&&(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='SELECT'))return;
  if(S.enter){e.preventDefault();S.enter()}
});

/* ---------- prototype controls ---------- */
const PRESETS={happy:['Happy path',{}],first:['First-timer with problems',{cam:'blocked',scr:'tab',failOnce:true}],fail:['Everything fails once',{cam:'inuse',mic:'silent',face:'none',scr:'window',ext:'blocked',start:'fail',failOnce:true}],early:['Early link',{link:'early'}],phone:['Phone on proctored',{device:'iphone'}],seb:['Safe Exam Browser',{type:'seb'}]};
const RESTART=['type','link','device','photo','consent','perms','micMode','bver','earlySetup','load','seb'];
function buildControls(){
  const o=S.o;
  const sel=(id,label,opts,val)=>`<label>${label}<select data-c="${id}">${opts.map(x=>`<option value="${x[0]}" ${x[0]===(val??o[id])?'selected':''}>${x[1]}</option>`).join('')}</select></label>`;
  $('#pcp').innerHTML=
   `<div class="pcl">Presets</div><div class="pcg">${Object.keys(PRESETS).map(k=>`<button data-p="${k}">${PRESETS[k][0]}</button>`).join('')}</div>`+
   `<label class="pck"><input type="checkbox" data-fo ${o.failOnce?'checked':''}>Fail once, then succeed</label>`+
   `<div class="pcl">Break it now</div><div class="pcg">${SCREEN_SHARE?'<button class="dk" data-b="screen">Stop screen sharing</button>':''}<button class="dk" data-b="cam">Unplug camera</button><button class="dk" data-b="offline">Go offline</button><button class="dk" data-b="signed">Signed in elsewhere</button><button class="dk" data-b="expired">Session expired</button><button data-b="clock">Advance clock to start</button><button data-b="reset">Reset</button></div>`+
   `<div class="pcl">Assessment</div>`+
   sel('type','Assessment type',[['proctored','Proctored'],['seb','Safe Exam Browser'],['non_proctored','Non-proctored (MCQ only)']])+
   sel('link','Link state',[['valid','Valid, open'],['early','Early (before start)'],['late','Late'],['resume','Resume (assessment running)'],['closed','Closed'],['submitted','Already submitted'],['invalid','Invalid link'],['error','Server error']])+
   sel('device','Device',[['win_chrome','Windows, Chrome'],['mac_chrome','Mac, Chrome'],['mac_safari','Mac, Safari'],['iphone','iPhone'],['android_tablet','Android tablet']])+
   sel('photo','Candidate',[['first','First time (take photo)'],['returning','Returning (quick check)']])+
   `<div class="pcl">Checks</div>`+
   sel('net','Network',[['good','Excellent'],['slow','Slow (6 Mbps)'],['tooslow','Too slow (under 5 Mbps)'],['offline','Offline']],S.net)+
   sel('ext','Browser extensions',[['clear','None found'],['blocked','Blocked extension found']])+
   sel('disp','Displays',[['one','One screen'],['multi','Extra monitor detected']])+
   sel('browser','Browser',[['auto','Auto-detect (this browser)'],['chrome','Google Chrome'],['edge','Microsoft Edge'],['brave','Brave'],['opera','Opera'],['operamini','Opera Mini'],['firefox','Firefox'],['safari','Safari']])+
   sel('perms','Permissions',[['first','First attempt (ask)'],['granted','Already granted (skip card)']])+
   sel('cam','Camera',[['ok','OK'],['dark','Too dark (warning, passes)'],['blocked','Blocked'],['dismissed','Prompt dismissed'],['notfound','No camera found'],['inuse','In use by another app'],['osblocked','Blocked by the OS']])+
   sel('face','Face check',[['ok','OK'],['none','No face'],['multiple','More than one person'],['covered','Face covered'],['far','Too far'],['close','Too close'],['dark','Face too dark'],['nomatch','Not recognised']])+
   sel('mic','Microphone',[['clear','Clear'],['noisy','Noisy (warning, passes)'],['silent','Silent'],['blocked','Blocked'],['notfound','No microphone found']])+
   (SCREEN_SHARE?sel('scr','Screen sharing',[['ok','Works'],['cancelled','Picker cancelled'],['tab','Shared a tab'],['window','Shared a window'],['multi','Second screen found'],['osblocked','Blocked by the OS']]):'')+
   sel('start','Start (Code of Conduct)',[['ok','Works'],['fail','Fails']])+
   sel('secs','Sections list',[['some','Has sections'],['none','None assigned (empty state)']])+
   sel('sv','Sections design',[['a','A · Cards'],['b','B · Timeline'],['c','C · Compact table'],['d','D · Tiles']],o.sv||'b')+
   `<div class="pcl">More</div>`+
   sel('consent','Consent',[['new','Not given yet'],['already','Already agreed']])+
   sel('micMode','Microphone mode',[['required','Required'],['optional','Optional (can skip)']])+
   sel('bver','Browser version',[['default','Up to date'],['outdated','Outdated']])+
   sel('earlySetup','Early setup',[['allowed','Allowed'],['locked','Locked until start']])+
   sel('seb','SEB launch',[['works','Works'],['blocked','Blocked by browser']])+
   sel('load','Link load',[['normal','Normal'],['slow','Slow (12 s)']]);
  const pcp=$('#pcp');
  $$('[data-c]',pcp).forEach(s=>s.onchange=()=>{
    const k=s.dataset.c,v=s.value;
    if(k==='net'){S.net=v;if(S.step==='rules'&&!gateKind())render();else{banners();if(['review','coc','sections'].includes(S.step)&&!gateKind())render()}return}
    S.o[k]=v;
    if(RESTART.includes(k))return restart();
    if(['browser','ext','disp'].includes(k)&&S.step==='rules'&&!gateKind())render();
    if((k==='sv'||k==='secs')&&S.step==='sections'&&!document.querySelector('.live'))render();
  });
  $('[data-fo]',pcp).onchange=e=>{S.o.failOnce=e.target.checked};
  $$('[data-p]',pcp).forEach(b=>b.onclick=()=>{const p=PRESETS[b.dataset.p][1];S.o={...O0(),...p};S.net=b.dataset.p==='fail'?'slow':'good';restart()});
  $$('[data-b]',pcp).forEach(b=>b.onclick=()=>{
    const k=b.dataset.b,live=!!document.querySelector('.live');
    if(k==='reset')return reset();
    if(k==='clock'){S.startAt=Date.now();return render()}
    if(k==='signed')return openSigned();
    if(k==='expired')return openExpired();
    if(k==='offline'){S.net='offline';buildControls();if(['rules','review','coc'].includes(S.step)&&!live&&!gateKind())render();else banners();return}
    if(k==='screen'){if(!ids().includes('screen')||!S.ok.screen)return toast('Screen sharing isn’t running yet');S.ok.screen=false;S.banner=MSG.SCREEN_STOPPED}
    if(k==='cam'){if(!ids().includes('cam')||!S.ok.cam)return toast('Camera isn’t running yet');S.ok.cam=false;S.banner=MSG.CAM_UNPLUGGED}
    if(['review','coc','sections'].includes(S.step)&&!live)render();else banners();
  });
}
function reset(){S.o=O0();S.net='good';restart()}
$('#pcb').onclick=()=>{const p=$('#pcp'),o=p.hidden;p.hidden=!o;$('#pcb').setAttribute('aria-expanded',o)};
restart();

/* rule guide: a clear "your assessment starts now" moment */
function startsNow(done){const first=S.name.trim().split(/\s+/)[0];const el=document.createElement('div');el.className='snow';el.setAttribute('role','status');el.setAttribute('aria-live','assertive');
 el.innerHTML=`<div class="snow-c"><span class="snow-i">${CKSVG}</span><h2>Your assessment starts now</h2><p>Your timer is running. Good luck, ${first}.</p></div>`;
 document.body.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();done()},250)},1800)}
</script>
